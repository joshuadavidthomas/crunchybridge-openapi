EID:
  type: string
  description: |
    A lowercase, 26-character Base32 encoding of a 128-bit identifier.
  pattern: ^[a-z2-7]{25}[aeimquy4]$
  examples:
    - rvf73a77ozfsvcttryebfrnlem

Error:
  type: object
  description: |
    An API error. The public documentation guarantees a human-readable
    message and a request ID, but does not document the full error shape.
  required:
    - message
    - request_id
  properties:
    code:
      type: [string, "null"]
      enum:
        - account_disabled
        - account_email_not_verified
        - account_sso_only
        - maintenance_mode
        - multi_factor_challenge_required
        - transient_server_error
        - null
      description: Public machine-readable error code, when one is available.
    is_transient:
      type: boolean
      description: Whether retrying the request may succeed without a change.
    message:
      type: string
      description: A human-readable description of the error.
    multi_factor:
      $ref: '#/MultiFactorChallenge'
    request_id:
      type: string
      format: uuid
      description: The request identifier to include when contacting support.
  if:
    required: [code]
    properties:
      code:
        const: multi_factor_challenge_required
  then:
    required: [multi_factor]
    properties:
      multi_factor:
        $ref: '#/MultiFactorChallenge'
  additionalProperties: true

MultiFactorChallenge:
  type: object
  description: |
    Available challenge methods. Retry the request with a response in the
    indicated header for an enabled method.
  required: [is_required, recovery_code, totp, webauthn]
  properties:
    is_required:
      type: boolean
      const: true
    recovery_code:
      type: object
      required: [header, is_enabled, num_valid]
      properties:
        header:
          type: string
        is_enabled:
          type: boolean
        num_valid:
          type: integer
          format: int64
      additionalProperties: true
    totp:
      type: object
      required: [header, is_enabled]
      properties:
        header:
          type: string
        is_enabled:
          type: boolean
      additionalProperties: true
    webauthn:
      type: object
      required: [header, is_enabled]
      properties:
        header:
          type: string
        is_enabled:
          type: boolean
        credential_request_options:
          type: object
          description: Public key credential request options for navigator.credentials.get().
          additionalProperties: true
      additionalProperties: true
  additionalProperties: true

PrivateNetworkCIDR4:
  type: string
  description: RFC 1918 IPv4 network contained in 10/8, 172.16/12, or 192.168/16, with a prefix length no greater than 20.
  allOf:
    - type: string
      pattern: '^(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])(?:\.(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])){3}/(?:[89]|1[0-9]|20)$'
    - type: string
      pattern: '^(?:10\..*/(?:[89]|1[0-9]|20)|172\.(?:1[6-9]|2[0-9]|3[01])\..*/(?:1[2-9]|20)|192\.168\..*/(?:1[6-9]|20))$'
