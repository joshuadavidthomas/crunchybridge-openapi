    tags: [Clusters]
    summary: Get cluster status
    description: Returns the cluster state, active work, disk usage, and oldest restorable backup point.
    x-docs-url: https://docs.crunchybridge.com/api/cluster#get-cluster-status
    x-idempotent: true
    responses:
      "200":
        $ref: ../components/responses/cluster.yaml#/ClusterStatus
      "401":
        $ref: ../components/responses/errors.yaml#/Unauthorized
      "403":
        $ref: ../components/responses/errors.yaml#/Forbidden
      "404":
        $ref: ../components/responses/errors.yaml#/NotFound
