forks:
  parameters:
    - $ref: ../components/parameters/common.yaml#/XRequestId
    - $ref: ../components/parameters/eids.yaml#/ClusterId
  post:
    operationId: forkCluster
    tags: [Clusters]
    summary: Fork a cluster
    description: |
      Starts provisioning a separately billed cluster from a backup point. A
      supplied provider requires plan and region; omitted placement, plan, and
      storage fields inherit from the source. A supplied region must match the
      network. Recovery targets must fall within the status endpoint's oldest
      backup bounds and the current database position. The source must have an
      initial backup. Network selection follows the create operation's exclusions.
    x-docs-url: https://docs.crunchybridge.com/api/cluster#fork-cluster
    x-idempotent: false
    x-cost-bearing: true
    x-long-running: true
    parameters:
      - $ref: ../components/parameters/common.yaml#/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/cluster.yaml#/ClusterForkRequest
    responses:
      "201":
        $ref: ../components/responses/cluster.yaml#/ClusterCreated
      "401":
        $ref: ../components/responses/errors.yaml#/Unauthorized
      "403":
        $ref: ../components/responses/errors.yaml#/Forbidden
      "404":
        $ref: ../components/responses/errors.yaml#/NotFound
      "409":
        $ref: ../components/responses/errors.yaml#/IdempotencyConflict
      "429":
        $ref: ../components/responses/errors.yaml#/RateLimited
      default:
        $ref: ../components/responses/errors.yaml#/Error

