collection:
  parameters:
    - $ref: ../components/parameters/common.yaml#/XRequestId
  get:
    operationId: listClusters
    tags: [Clusters]
    summary: List clusters
    description: Returns clusters visible to the caller, ordered by name by default.
    x-docs-url: https://docs.crunchybridge.com/api/cluster#list-clusters
    x-idempotent: true
    parameters:
      - $ref: ../components/parameters/common.yaml#/Cursor
      - name: limit
        in: query
        required: false
        description: Maximum number of clusters to return.
        schema:
          type: integer
          format: int64
          minimum: 1
          maximum: 200
          default: 100
      - $ref: ../components/parameters/common.yaml#/Order
      - name: order_field
        in: query
        required: false
        schema:
          type: string
          enum: [id, name]
          default: name
      - name: team_id
        in: query
        required: false
        schema:
          oneOf:
            - $ref: ../components/schemas/common.yaml#/EID
            - type: "null"
    responses:
      "200":
        $ref: ../components/responses/cluster.yaml#/ClusterList
      "401":
        $ref: ../components/responses/errors.yaml#/Unauthorized
      "403":
        $ref: ../components/responses/errors.yaml#/Forbidden
      "429":
        $ref: ../components/responses/errors.yaml#/RateLimited
      default:
        $ref: ../components/responses/errors.yaml#/Error
  post:
    operationId: createCluster
    tags: [Clusters]
    summary: Create a cluster
    description: |
      Starts provisioning a billed cluster. `firewall_mode`, `network_id`, and
      `network_cidr4` are mutually exclusive. If neither network field is supplied,
      Bridge creates a network and applies `firewall_mode` when present. `provider_id`
      cannot accompany `network_id`. A GCP
      network requires `region_id`; other supplied network and region values must
      agree. `network_cidr4` must fall within RFC 1918 private space with a prefix
      no longer than 20 bits. Omitting `postgres_version_id` selects the current
      default. The required request fields make a body necessary even though the
      generated first-party description omits body-level requiredness.
    x-docs-url: https://docs.crunchybridge.com/api/cluster#create-cluster
    x-idempotent: false
    x-cost-bearing: true
    x-long-running: true
    x-sensitive: true
    parameters:
      - $ref: ../components/parameters/common.yaml#/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/cluster.yaml#/ClusterCreateRequest
    responses:
      "201":
        $ref: ../components/responses/cluster.yaml#/ClusterCreated
      "401":
        $ref: ../components/responses/errors.yaml#/Unauthorized
      "403":
        $ref: ../components/responses/errors.yaml#/Forbidden
      "409":
        $ref: ../components/responses/errors.yaml#/IdempotencyConflict
      "429":
        $ref: ../components/responses/errors.yaml#/RateLimited
      default:
        $ref: ../components/responses/errors.yaml#/Error

item:
  parameters:
    - $ref: ../components/parameters/common.yaml#/XRequestId
    - $ref: ../components/parameters/eids.yaml#/ClusterId
  get:
    operationId: getCluster
    tags: [Clusters]
    summary: Get a cluster
    description: Returns one cluster and its current resource fields.
    x-docs-url: https://docs.crunchybridge.com/api/cluster#get-cluster
    x-idempotent: true
    responses:
      "200":
        $ref: ../components/responses/cluster.yaml#/Cluster
      "401":
        $ref: ../components/responses/errors.yaml#/Unauthorized
      "403":
        $ref: ../components/responses/errors.yaml#/Forbidden
      "404":
        $ref: ../components/responses/errors.yaml#/NotFound
      "429":
        $ref: ../components/responses/errors.yaml#/RateLimited
      default:
        $ref: ../components/responses/errors.yaml#/Error
  patch:
    operationId: updateCluster
    tags: [Clusters]
    summary: Update a cluster
    description: Every update field is optional. Whether the endpoint accepts an omitted body remains unconfirmed.
    x-docs-url: https://docs.crunchybridge.com/api/cluster#update-cluster
    x-idempotent: false
    parameters:
      - $ref: ../components/parameters/common.yaml#/IdempotencyKey
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: ../components/schemas/cluster.yaml#/ClusterUpdateRequest
    responses:
      "200":
        $ref: ../components/responses/cluster.yaml#/ClusterUpdated
      "401":
        $ref: ../components/responses/errors.yaml#/Unauthorized
      "403":
        $ref: ../components/responses/errors.yaml#/Forbidden
      "404":
        $ref: ../components/responses/errors.yaml#/NotFound
      "409":
        $ref: ../components/responses/errors.yaml#/IdempotencyConflict
      "429":
        $ref: ../components/responses/errors.yaml#/RateLimited
      default:
        $ref: ../components/responses/errors.yaml#/Error
  delete:
    operationId: destroyCluster
    tags: [Clusters]
    summary: Delete a cluster
    description: Permanently deletes an unprotected cluster and its data.
    x-docs-url: https://docs.crunchybridge.com/api/cluster#destroy-cluster
    x-idempotent: true
    x-destructive: true
    responses:
      "200":
        $ref: ../components/responses/cluster.yaml#/Cluster
      "401":
        $ref: ../components/responses/errors.yaml#/Unauthorized
      "403":
        $ref: ../components/responses/errors.yaml#/Forbidden
      "404":
        $ref: ../components/responses/errors.yaml#/NotFound
      "410":
        $ref: ../components/responses/errors.yaml#/Gone
      "429":
        $ref: ../components/responses/errors.yaml#/RateLimited
      default:
        $ref: ../components/responses/errors.yaml#/Error

