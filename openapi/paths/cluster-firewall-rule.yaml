      Deprecated. Obtain the cluster's `network_id`, then use
      `PATCH /networks/{network_id}/firewall-rules/{rule_id}`. This legacy PUT
      requires `rule`; the first-party machine description omits body requiredness.
    x-docs-url: https://docs.crunchybridge.com/api/cluster-firewall-rule#update-firewall-rule
    x-idempotent: true
    x-disruptive: true
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/firewall-rule.yaml#/ClusterFirewallRuleUpdateRequest
    responses:
      "200":
        description: The updated firewall rule.
        headers:
          X-Request-Id:
            $ref: ../components/headers/common.yaml#/XRequestId
        content:
          application/json:
            schema:
              $ref: ../components/schemas/firewall-rule.yaml#/FirewallRule
      "400":
        $ref: ../components/responses/errors.yaml#/BadRequest
      "401":
        $ref: ../components/responses/errors.yaml#/Unauthorized
      "403":
        $ref: ../components/responses/errors.yaml#/Forbidden
      "404":
        $ref: ../components/responses/errors.yaml#/NotFound
      "429":
        $ref: ../components/responses/errors.yaml#/RateLimited
      default:
        $ref: ../components/responses/errors.yaml#/Error
  delete:
    operationId: destroyClusterFirewallRule
    deprecated: true
    tags:
      - Firewall rules
    summary: Delete a firewall rule through a cluster
    description: |
      Deprecated. Obtain the cluster's `network_id`, then use
      `DELETE /networks/{network_id}/firewall-rules/{rule_id}`.
    x-docs-url: https://docs.crunchybridge.com/api/cluster-firewall-rule#destroy-firewall-rule
    x-disruptive: true
    x-idempotent: true
    responses:
      "200":
        description: The deleted firewall rule.
        headers:
          X-Request-Id:
            $ref: ../components/headers/common.yaml#/XRequestId
        content:
          application/json:
            schema:
              $ref: ../components/schemas/firewall-rule.yaml#/FirewallRule
      "401":
        $ref: ../components/responses/errors.yaml#/Unauthorized
      "403":
        $ref: ../components/responses/errors.yaml#/Forbidden
      "404":
        $ref: ../components/responses/errors.yaml#/NotFound
      "410":
        $ref: ../components/responses/errors.yaml#/Gone
      "429":
        $ref: ../components/responses/errors.yaml#/RateLimited
      default:
        $ref: ../components/responses/errors.yaml#/Error
