        default:
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        A long-lived Crunchy Bridge API key or a short-lived access token.
  schemas:
    EID:
      type: string
      description: |
        A lowercase, 26-character Base32 encoding of a 128-bit identifier.
      pattern: ^[a-z2-7]{25}[aeimquy4]$
      examples:
        - rvf73a77ozfsvcttryebfrnlem
    Error:
      type: object
      description: |
        An API error. The public documentation guarantees a human-readable
        message and a request ID, but does not document the full error shape.
      required:
        - message
        - request_id
      properties:
        code:
          type:
            - string
            - 'null'
          enum:
            - account_disabled
            - account_email_not_verified
            - account_sso_only
            - maintenance_mode
            - multi_factor_challenge_required
            - transient_server_error
            - null
          description: Public machine-readable error code, when one is available.
        is_transient:
          type: boolean
          description: Whether retrying the request may succeed without a change.
        message:
          type: string
          description: A human-readable description of the error.
        multi_factor:
          $ref: '#/components/schemas/MultiFactorChallenge'
        request_id:
          type: string
          format: uuid
          description: The request identifier to include when contacting support.
      if:
        required:
          - code
        properties:
          code:
            const: multi_factor_challenge_required
      then:
        required:
          - multi_factor
        properties:
          multi_factor:
            $ref: '#/components/schemas/MultiFactorChallenge'
      additionalProperties: true
    Cluster:
      type: object
      required:
        - created_at
        - id
        - is_ha
        - is_protected
        - is_suspended
        - major_version
        - memory
        - name
        - plan_id
        - postgres_version_id
        - provider_id
        - region_id
        - storage
        - team_id
        - updated_at
        - variable_backups
        - vcpu
      properties:
        id:
          $ref: '#/components/schemas/EID'
        cluster_group:
          $ref: '#/components/schemas/ClusterGroup'
        created_at:
          type: string
          format: date-time
        disk_usage:
          deprecated: true
          description: Deprecated. Disk usage may be null before collection.
          oneOf:
            - $ref: '#/components/schemas/ClusterDiskUsage'
            - type: 'null'
        environment:
          oneOf:
            - type: string
              enum:
                - production
            - type: 'null'
        expires_at:
          type:
            - string
            - 'null'
          format: date-time
        host:
          type: string
        is_ha:
          type: boolean
        is_protected:
          type: boolean
        is_suspended:
          type: boolean
        keychain_id:
          oneOf:
            - $ref: '#/components/schemas/EID'
            - type: 'null'
        maintenance_window_start:
          type:
            - integer
            - 'null'
          format: int32
          minimum: 0
          maximum: 23
        major_version:
          type: integer
          format: int32
        memory:
          type: number
          format: float
        name:
          type: string
        network_id:
          oneOf:
            - $ref: '#/components/schemas/EID'
            - type: 'null'
        next_periodic_maintenance_at:
          type:
            - string
            - 'null'
          format: date-time
        ongoing_operations:
          type:
            - array
            - 'null'
          items:
            $ref: '#/components/schemas/ClusterOperation'
        parent_id:
          oneOf:
            - $ref: '#/components/schemas/EID'
            - type: 'null'
        periodic_maintenance_frequency:
          type: integer
          format: int32
        plan_id:
          type: string
        postgres_version_id:
          $ref: '#/components/schemas/EID'
        provider_id:
          oneOf:
            - type: string
              enum:
                - aws
                - azure
                - gcp
            - type: 'null'
        region_id:
          type: string
        replicas:
          type:
            - array
            - 'null'
          items:
            $ref: '#/components/schemas/Cluster'
        state:
          oneOf:
            - $ref: '#/components/schemas/ClusterState'
            - type: 'null'
        storage:
          type: integer
          format: int32
        tailscale_active:
          type: boolean
        team_id:
          $ref: '#/components/schemas/EID'
        updated_at:
          type: string
          format: date-time
        variable_backups:
          $ref: '#/components/schemas/ClusterVariableBackups'
        vcpu:
          type: number
          format: float
        zone:
          type:
            - string
            - 'null'
        cluster_id:
          deprecated: true
          description: Deprecated. Use `parent_id`.
          oneOf:
            - $ref: '#/components/schemas/EID'
            - type: 'null'
        cpu:
          type: integer
          format: int64
          deprecated: true
          description: Deprecated. Use `vcpu`.
      additionalProperties: true
    ClusterList:
      type: object
      required:
        - clusters
        - has_more
      properties:
        clusters:
          type: array
          items:
            $ref: '#/components/schemas/Cluster'
        has_more:
          type: boolean
        next_cursor:
          type:
            - string
            - 'null'
      additionalProperties: true
    ClusterStatus:
      type: object
      required:
        - state
      properties:
        disk_usage:
          oneOf:
            - $ref: '#/components/schemas/ClusterDiskUsage'
            - type: 'null'
        oldest_backup_at:
          type:
            - string
            - 'null'
          format: date-time
        oldest_backup_lsn:
          type:
            - string
            - 'null'
        ongoing_upgrade:
          oneOf:
            - $ref: '#/components/schemas/ClusterStatusUpgrade'
            - type: 'null'
        state:
          oneOf:
            - $ref: '#/components/schemas/ClusterState'
            - type: 'null'
      additionalProperties: true
    ClusterOperation:
      type: object
      required:
        - flavor
        - state
      properties:
        flavor:
          type: string
          enum:
            - auto_resize
            - ha_change
            - maintenance
            - major_version_upgrade
            - periodic_maintenance
            - rekey
            - resize
        starting_from:
          type:
            - string
            - 'null'
          format: date-time
        state:
          type: string
          enum:
            - canceling
            - creating
            - creation_failed
            - destroying
            - disabling_ha
            - enabling_ha
            - failing_over
            - finalizing
            - in_progress
            - ready
            - replaying
            - restarting
            - restoring
            - resuming
            - starting
            - suspended
            - suspending
            - waiting_for_ha_standby
      additionalProperties: true
    ClusterCreateRequest:
      type: object
      required:
        - name
        - plan_id
        - team_id
      allOf:
        - not:
            required:
              - network_cidr4
              - network_id
            properties:
              network_cidr4:
                type: string
              network_id:
                $ref: '#/components/schemas/EID'
        - not:
            required:
              - firewall_mode
              - network_cidr4
            properties:
              firewall_mode:
                type: string
              network_cidr4:
                type: string
        - not:
            required:
              - firewall_mode
              - network_id
            properties:
              firewall_mode:
                type: string
              network_id:
                $ref: '#/components/schemas/EID'
        - not:
            required:
              - network_id
              - provider_id
            properties:
              network_id:
                $ref: '#/components/schemas/EID'
              provider_id:
                type: string
      properties:
        name:
          type: string
        plan_id:
          type: string
        team_id:
          $ref: '#/components/schemas/EID'
        cluster_group_id:
          oneOf:
            - $ref: '#/components/schemas/EID'
            - type: 'null'
        environment:
          oneOf:
            - type: string
              enum:
                - production
            - type: 'null'
        expires_at:
          type:
            - string
            - 'null'
          format: date-time
          description: Time when the cluster may be reaped with data loss.
        firewall_mode:
          type:
            - string
            - 'null'
          enum:
            - allow_all
            - deny_all
            - null
        is_ha:
          type: boolean
        keychain_id:
          oneOf:
            - $ref: '#/components/schemas/EID'
            - type: 'null'
        maintenance_window_start:
          type:
            - integer
            - 'null'
          format: int32
          minimum: 0
          maximum: 23
        network_cidr4:
          oneOf:
            - $ref: '#/components/schemas/PrivateNetworkCIDR4'
            - type: 'null'
        network_id:
          oneOf:
            - $ref: '#/components/schemas/EID'
            - type: 'null'
        parameters:
          type:
            - array
            - 'null'
          items:
            $ref: '#/components/schemas/ConfigurationParameterInput'
        postgres_version_id:
          oneOf:
            - type: integer
              format: int32
            - $ref: '#/components/schemas/EID'
            - type: 'null'
        provider_id:
          type:
            - string
            - 'null'
          enum:
            - aws
            - azure
            - gcp
            - null
        region_id:
          type:
            - string
            - 'null'
        roles:
          type:
            - array
            - 'null'
          items:
            $ref: '#/components/schemas/ClusterCreateRole'
        snowflake_entity_id:
          type:
            - integer
            - 'null'
          format: int64
        storage:
          type: integer
          format: int32
        major_version:
          type:
            - integer
            - 'null'
          format: int32
          deprecated: true
          description: Deprecated. Use `postgres_version_id`.
      additionalProperties: false
    ClusterUpdateRequest:
      type: object
      properties:
        cluster_group_id:
          oneOf:
            - $ref: '#/components/schemas/EID'
            - type: 'null'
        dashboard_settings:
          $ref: '#/components/schemas/ClusterDashboardSettings'
        environment:
          oneOf:
            - type: string
              enum:
                - ''
                - production
            - type: 'null'
          description: An empty string clears the environment.
        is_protected:
          type:
            - boolean
            - 'null'
        maintenance_window_start:
          type:
            - integer
            - 'null'
          format: int32
          minimum: -1
          maximum: 23
          description: Set to -1 to remove the maintenance window.
        name:
          type:
            - string
            - 'null'
        next_periodic_maintenance_at:
          type:
            - string
            - 'null'
          format: date-time
        periodic_maintenance_frequency:
          type:
            - integer
            - 'null'
          format: int32
          minimum: 7
          maximum: 365
        variable_backups:
          oneOf:
            - $ref: '#/components/schemas/ClusterUpdateVariableBackups'
            - type: 'null'
      additionalProperties: false
    ClusterForkRequest:
      type: object
      required:
        - name
      allOf:
        - not:
            required:
              - network_cidr4
              - network_id
            properties:
              network_cidr4:
                type: string
              network_id:
                $ref: '#/components/schemas/EID'
        - not:
            required:
              - firewall_mode
              - network_cidr4
            properties:
              firewall_mode:
                type: string
              network_cidr4:
                type: string
        - not:
            required:
              - firewall_mode
              - network_id
            properties:
              firewall_mode:
                type: string
              network_id:
                $ref: '#/components/schemas/EID'
        - if:
            required:
              - provider_id
            properties:
              provider_id:
                type: string
          then:
            required:
              - plan_id
              - region_id
            properties:
              plan_id:
                type: string
              region_id:
                type: string
      properties:
        name:
          type: string
        firewall_mode:
          type:
            - string
            - 'null'
          enum:
            - allow_all
            - deny_all
            - null
        is_ha:
          type: boolean
        keychain_id:
          oneOf:
            - $ref: '#/components/schemas/EID'
            - type: 'null'
        network_cidr4:
          oneOf:
            - $ref: '#/components/schemas/PrivateNetworkCIDR4'
            - type: 'null'
        network_id:
          oneOf:
            - $ref: '#/components/schemas/EID'
            - type: 'null'
        plan_id:
          type:
            - string
            - 'null'
        provider_id:
          type:
            - string
            - 'null'
          enum:
            - aws
            - azure
            - gcp
            - null
        region_id:
          type:
            - string
            - 'null'
        snowflake_entity_id:
          type:
            - integer
            - 'null'
          format: int64
        storage:
          type:
            - integer
            - 'null'
          format: int32
        target_lsn:
          type:
            - string
            - 'null'
        target_time:
          type:
            - string
            - 'null'
          format: date-time
      additionalProperties: false
    ClusterRestartRequest:
      type: object
      properties:
        service:
          type:
            - string
            - 'null'
          enum:
            - postgres
            - server
            - null
          description: Omission defaults to `server`.
      additionalProperties: false
    TailscaleConnectRequest:
      type: object
      not:
        required:
          - auth_key
          - tailscale_oauth_client_id
        properties:
          auth_key:
            type: string
          tailscale_oauth_client_id:
            $ref: '#/components/schemas/EID'
      properties:
        auth_key:
          type:
            - string
            - 'null'
          description: Short-lived Tailscale auth key. Mutually exclusive with `tailscale_oauth_client_id`.
        tailscale_oauth_client_id:
          oneOf:
            - $ref: '#/components/schemas/EID'
            - type: 'null'
          description: Stored Tailscale OAuth client. Mutually exclusive with `auth_key`.
      additionalProperties: false
    ClusterBackup:
      type: object
      properties:
        finished_at:
          type: string
          format: date-time
        lsn_start:
          type:
            - string
            - 'null'
        lsn_stop:
          type:
            - string
            - 'null'
        major_version:
          type:
            - integer
            - 'null'
          format: int32
        name:
          type: string
        size_bytes:
          type:
            - integer
            - 'null'
          format: int64
        started_at:
          type:
            - string
            - 'null'
          format: date-time
        type:
          type: string
          description: Backup type; the docs mention full, differential, and incremental backups without declaring an enum.
      additionalProperties: true
    ClusterBackupList:
      type: object
      required:
        - backups
      properties:
        backups:
          type: array
          items:
            $ref: '#/components/schemas/ClusterBackup'
      additionalProperties: true
    ClusterBackupToken:
      oneOf:
        - allOf:
            - $ref: '#/components/schemas/ClusterBackupTokenBase'
            - type: object
              required:
                - aws
              properties:
                type:
                  const: s3
                aws:
                  $ref: '#/components/schemas/AWSBackupToken'
                azure: false
                gcp: false
        - allOf:
            - $ref: '#/components/schemas/ClusterBackupTokenBase'
            - type: object
              required:
                - azure
              properties:
                type:
                  const: azure
                aws: false
                azure:
                  $ref: '#/components/schemas/AzureBackupToken'
                gcp: false
        - allOf:
            - $ref: '#/components/schemas/ClusterBackupTokenBase'
            - type: object
              required:
                - gcp
              properties:
                type:
                  const: gcs
                aws: false
