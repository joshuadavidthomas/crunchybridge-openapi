            - type: 'null'
        request_id:
          description: UUID of the API request that caused the event, if any.
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        team_id:
          description: EID of the associated team, if any.
          oneOf:
            - $ref: '#/components/schemas/EID'
            - type: 'null'
      additionalProperties: true
