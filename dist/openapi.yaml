        actor_id:
          description: EID of the account that caused the event, if any.
          oneOf:
            - $ref: '#/components/schemas/EID'
            - type: 'null'
        actor_ip:
          type: string
          description: IP address of the actor, if the event has one.
        cluster_id:
          description: EID of the associated cluster, if any.
          oneOf:
            - $ref: '#/components/schemas/EID'
            - type: 'null'
        created_at:
          type: string
          format: date-time
          description: When the event occurred.
        data:
          type: object
          description: A historical snapshot of the affected resource.
          additionalProperties: true
        description:
          type: string
          description: Human-readable text whose format may change without notice.
        kind:
          type: string
          description: Event kind, such as `cluster.created` or `cluster.suspended`.
        object_id:
          $ref: '#/components/schemas/EID'
        object_kind:
          type: string
          description: Kind of the primary object affected by the event.
        previous_properties:
          description: Previous values for changed fields, usually on update events.
          oneOf:
            - type: object
