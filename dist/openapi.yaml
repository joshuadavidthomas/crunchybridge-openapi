  /teams/{team_id}/members/{account_id}:
    parameters:
      - $ref: '#/components/parameters/XRequestId'
      - $ref: '#/components/parameters/TeamId'
      - $ref: '#/components/parameters/AccountId'
    get:
      operationId: getTeamMember
      tags:
        - Team members
      summary: Get a team member
      description: Returns a team membership by the member's account EID.
      x-docs-url: https://docs.crunchybridge.com/api/team-member#get-team-member
      x-idempotent: true
      x-sensitive: true
      responses:
        '200':
          description: The team member.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamMember'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: updateTeamMember
      tags:
        - Team members
      summary: Add or update a team member
