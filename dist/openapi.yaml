        - line_1
      properties:
        city:
          type: string
        country:
          type: string
          description: Two-letter country code.
        line_1:
          type: string
        line_2:
          type:
            - string
            - 'null'
        name:
          type:
            - string
            - 'null'
        postal_code:
          type:
            - string
            - 'null'
        state:
          type:
            - string
            - 'null'
      additionalProperties: true
    DatabaseRoleFlavor:
      type: string
