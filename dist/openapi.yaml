openapi: 3.1.0
info:
  title: Crunchy Bridge API
  version: 0.1.1
  summary: An unofficial description of the Crunchy Bridge API.
  description: |
    Use the Crunchy Bridge API to manage accounts, teams, clusters, and
    related resources. This document is maintained from the public API
    documentation and is not published or endorsed by Crunchy Data.
  license:
    name: MIT
    identifier: MIT
  contact:
    name: crunchybridge-openapi maintainers
    url: https://github.com/joshuadavidthomas/crunchybridge-openapi
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: https://api.crunchybridge.com
    description: Production
security:
  - bearerAuth: []
tags:
  - name: Access tokens
    description: Short-lived credentials issued from API keys.
  - name: Accounts
    description: The currently authenticated user account.
  - name: Certificates
    description: Team certificate chains.
  - name: Changelogs
    description: Published Crunchy Bridge changes.
  - name: Cluster backups
    description: Backup history and temporary pgBackRest credentials.
  - name: Cluster loggers
    description: External syslog forwarding destinations.
  - name: Cluster replicas
    description: Read replicas and replica detachment.
  - name: Cluster upgrades
    description: Refresh, resize, and major-version upgrade work.
  - name: Clusters
    description: Managed Postgres clusters and lifecycle actions.
  - name: Configuration parameters
    description: Supported and cluster-specific Postgres and PgBouncer settings.
  - name: Events
    description: Audit events and event polling.
  - name: Firewall rules
    description: Network access rules, including deprecated cluster routes.
  - name: Metric views
    description: Chart-ready cluster metric series.
  - name: Network peerings
    description: Private routing between Crunchy Bridge and customer networks.
  - name: Networks
    description: Provider networks shared by team clusters.
  - name: Postgres versions
    description: Postgres versions available for clusters.
  - name: Providers
    description: Cloud providers, plans, regions, and pricing.
  - name: Private links
    description: Provider private-link services and endpoint connections.
  - name: Postgres roles
    description: Cluster database roles and credentials.
  - name: Queries
    description: Synchronous and asynchronous SQL execution.
  - name: Team members
    description: Team memberships and invitations.
  - name: Teams
    description: Teams, access policy, billing, and support settings.
externalDocs:
  description: Crunchy Bridge API documentation
  url: https://docs.crunchybridge.com/api
paths:
  /access-tokens:
    parameters:
      - $ref: '#/components/parameters/XRequestId'
    post:
      operationId: createAccessToken
      tags:
        - Access tokens
      summary: Create an access token
      description: Exchanges an API key secret for an access token.
      security: []
      x-docs-url: https://docs.crunchybridge.com/api/access-token#create-access-token
      x-idempotent: false
      x-sensitive: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessTokenCreateRequest'
      responses:
        '200':
          description: The new access token. The bearer token is returned only once.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Idempotency-Key:
              $ref: '#/components/headers/IdempotencyKey'
            Idempotency-Replay:
              $ref: '#/components/headers/IdempotencyReplay'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'
  /access-tokens/{access_token_id}:
    parameters:
      - $ref: '#/components/parameters/XRequestId'
      - $ref: '#/components/parameters/AccessTokenId'
    delete:
      operationId: destroyAccessToken
      tags:
        - Access tokens
      summary: Delete an access token
      description: Revokes an access token and returns its resource.
      x-docs-url: https://docs.crunchybridge.com/api/access-token#destroy-access-token
      x-destructive: true
      x-idempotent: true
      x-sensitive: true
      responses:
        '200':
          description: The revoked access token.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'
  /account:
    parameters:
      - $ref: '#/components/parameters/XRequestId'
    get:
      operationId: getAccount
      tags:
        - Accounts
      summary: Get the authenticated account
      description: Returns the account associated with the supplied credential.
      x-docs-url: https://docs.crunchybridge.com/api/account#get-account
      x-idempotent: true
      x-sensitive: true
      responses:
        '200':
          description: The authenticated account.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: destroyAccount
      tags:
        - Accounts
      summary: Delete the authenticated account
      description: |
        Deletes the account. The account must not be the sole administrator of a
        team that owns provisioned clusters. Teams for which this account is the
        only administrator are also deleted.
      x-docs-url: https://docs.crunchybridge.com/api/account#destroy-account
      x-destructive: true
      x-idempotent: true
      x-sensitive: true
      responses:
        '200':
          description: The deleted account.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '410':
          $ref: '#/components/responses/Gone'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'
  /changelogs:
    parameters:
      - $ref: '#/components/parameters/XRequestId'
    get:
      operationId: listChangelogs
      tags:
        - Changelogs
      summary: List changelog entries
      description: Returns published Crunchy Bridge changes. Live requests succeed without authentication.
      security: []
      x-docs-url: https://docs.crunchybridge.com/api/changelog#list-changelog-entries
      x-idempotent: true
      parameters:
        - name: component
          in: query
          required: false
          description: Product area to include.
          schema:
            $ref: '#/components/schemas/ChangelogComponent'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit200'
        - $ref: '#/components/parameters/Order'
        - name: order_field
          in: query
          required: false
          description: Field used to order changelog entries.
          schema:
            type: string
            enum:
              - id
            default: id
      responses:
        '200':
          description: A page of changelog entries.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangelogList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'
  /changelogs/{changelog_id_or_name}:
    parameters:
      - $ref: '#/components/parameters/XRequestId'
      - $ref: '#/components/parameters/ChangelogIdOrName'
    get:
      operationId: getChangelog
      tags:
        - Changelogs
      summary: Get a changelog entry
      description: Returns a changelog entry by EID or unique name. Live requests succeed without authentication.
      security: []
      x-docs-url: https://docs.crunchybridge.com/api/changelog#get-changelog-entry
      x-idempotent: true
      responses:
        '200':
          description: The changelog entry.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Changelog'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'
  /clusters:
    parameters:
      - $ref: '#/components/parameters/XRequestId'
    get:
      operationId: listClusters
      tags:
        - Clusters
      summary: List clusters
      description: Returns clusters visible to the caller, ordered by name by default.
      x-docs-url: https://docs.crunchybridge.com/api/cluster#list-clusters
      x-idempotent: true
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - name: limit
          in: query
          required: false
          description: Maximum number of clusters to return.
          schema:
            type: integer
            format: int64
            minimum: 1
            maximum: 200
            default: 100
        - $ref: '#/components/parameters/Order'
        - name: order_field
          in: query
          required: false
          schema:
            type: string
            enum:
              - id
              - name
            default: name
        - name: team_id
          in: query
          required: false
          schema:
            oneOf:
              - $ref: '#/components/schemas/EID'
              - type: 'null'
      responses:
        '200':
          $ref: '#/components/responses/ClusterList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createCluster
      tags:
        - Clusters
      summary: Create a cluster
      description: |
        Starts provisioning a billed cluster. `firewall_mode`, `network_id`, and
        `network_cidr4` are mutually exclusive. If neither network field is supplied,
        Bridge creates a network and applies `firewall_mode` when present. `provider_id`
        cannot accompany `network_id`. A GCP
        network requires `region_id`; other supplied network and region values must
        agree. `network_cidr4` must fall within RFC 1918 private space with a prefix
        no longer than 20 bits. Omitting `postgres_version_id` selects the current
        default. The required request fields make a body necessary even though the
        generated first-party description omits body-level requiredness.
      x-docs-url: https://docs.crunchybridge.com/api/cluster#create-cluster
      x-idempotent: false
      x-cost-bearing: true
      x-long-running: true
      x-sensitive: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClusterCreateRequest'
      responses:
        '201':
          $ref: '#/components/responses/ClusterCreated'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'
  /clusters/{cluster_id}:
    parameters:
      - $ref: '#/components/parameters/XRequestId'
      - $ref: '#/components/parameters/ClusterId'
    get:
      operationId: getCluster
      tags:
        - Clusters
      summary: Get a cluster
      description: Returns one cluster and its current resource fields.
      x-docs-url: https://docs.crunchybridge.com/api/cluster#get-cluster
      x-idempotent: true
      responses:
        '200':
          $ref: '#/components/responses/Cluster'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateCluster
      tags:
        - Clusters
      summary: Update a cluster
      description: Every update field is optional. Whether the endpoint accepts an omitted body remains unconfirmed.
      x-docs-url: https://docs.crunchybridge.com/api/cluster#update-cluster
      x-idempotent: false
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClusterUpdateRequest'
      responses:
        '200':
          $ref: '#/components/responses/ClusterUpdated'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: destroyCluster
      tags:
        - Clusters
      summary: Delete a cluster
      description: Permanently deletes an unprotected cluster and its data.
      x-docs-url: https://docs.crunchybridge.com/api/cluster#destroy-cluster
      x-idempotent: true
      x-destructive: true
      responses:
        '200':
          $ref: '#/components/responses/Cluster'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'
  /clusters/{cluster_id}/status:
    parameters:
      - $ref: '#/components/parameters/XRequestId'
      - $ref: '#/components/parameters/ClusterId'
    get:
      operationId: getClusterStatus
      tags:
        - Clusters
      summary: Get cluster status
      description: Returns the cluster state, active work, disk usage, and oldest restorable backup point.
      x-docs-url: https://docs.crunchybridge.com/api/cluster#get-cluster-status
      x-idempotent: true
      responses:
        '200':
          $ref: '#/components/responses/ClusterStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'
  /clusters/{cluster_id}/backups:
    parameters:
      - $ref: '#/components/parameters/XRequestId'
      - $ref: '#/components/parameters/ClusterId'
    get:
      operationId: listClusterBackups
      tags:
        - Cluster backups
      summary: List cluster backups
      description: Returns documented backups. Pagination inputs are accepted, but the published response has no cursor metadata.
      x-docs-url: https://docs.crunchybridge.com/api/cluster-backup#list-backups
      x-idempotent: true
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit200'
        - $ref: '#/components/parameters/Order'
        - name: order_field
          in: query
          required: false
          schema:
            type: string
            enum:
              - name
            default: name
      responses:
        '200':
          description: Cluster backups.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterBackupList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'
  /clusters/{cluster_id}/backup-tokens:
    parameters:
      - $ref: '#/components/parameters/XRequestId'
      - $ref: '#/components/parameters/ClusterId'
    post:
      operationId: createClusterBackupToken
      tags:
        - Cluster backups
      summary: Create a cluster backup token
      description: Creates fresh provider credentials for direct pgBackRest access. They remain valid for 36 hours, and Crunchy Bridge does not persist the token resource or its ID. Treat the full response as secret.
      x-docs-url: https://docs.crunchybridge.com/api/cluster-backup#create-backup-token
      x-idempotent: false
      x-sensitive: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Temporary backup credentials.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Idempotency-Key:
              $ref: '#/components/headers/IdempotencyKey'
            Idempotency-Replay:
              $ref: '#/components/headers/IdempotencyReplay'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterBackupToken'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'
  /clusters/{cluster_id}/configuration-parameters:
    parameters:
      - $ref: '#/components/parameters/XRequestId'
      - $ref: '#/components/parameters/ClusterId'
    get:
      operationId: listClusterConfigurationParameters
      tags:
        - Configuration parameters
      summary: List cluster configuration parameters
      description: Returns configured values; null values mean the component default applies.
      x-docs-url: https://docs.crunchybridge.com/api/configuration-parameter#list-cluster-configuration-parameters
      x-idempotent: true
      responses:
        '200':
          description: Cluster configuration parameter values.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterConfigurationParameterList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: updateClusterConfigurationParameters
      tags:
        - Configuration parameters
      summary: Update cluster configuration parameters
      description: Applies a batch of values or resets. When allowed, parameters marked `requires_restart` may restart Postgres.
      x-docs-url: https://docs.crunchybridge.com/api/configuration-parameter#update-cluster-configuration-parameters
      x-idempotent: true
      x-disruptive: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigurationParameterUpdateRequest'
      responses:
        '200':
          description: Cluster configuration parameter values.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterConfigurationParameterList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'
  /clusters/{cluster_id}/configuration-parameters/{configuration_parameter_name}:
    parameters:
      - $ref: '#/components/parameters/XRequestId'
      - $ref: '#/components/parameters/ClusterId'
      - $ref: '#/components/parameters/ConfigurationParameterName'
    get:
      operationId: getClusterConfigurationParameter
      tags:
        - Configuration parameters
      summary: Get a cluster configuration parameter
      description: Returns one fully qualified parameter such as `postgres:log_statement`.
      x-docs-url: https://docs.crunchybridge.com/api/configuration-parameter#get-a-cluster-configuration-parameter
      x-idempotent: true
      responses:
        '200':
          description: The cluster configuration parameter.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterConfigurationParameter'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'
  /clusters/{cluster_id}/forks:
    parameters:
      - $ref: '#/components/parameters/XRequestId'
      - $ref: '#/components/parameters/ClusterId'
    post:
      operationId: forkCluster
      tags:
        - Clusters
      summary: Fork a cluster
      description: |
        Starts provisioning a separately billed cluster from a backup point. A
        supplied provider requires plan and region; omitted placement, plan, and
        storage fields inherit from the source. A supplied region must match the
        network. Recovery targets must fall within the status endpoint's oldest
        backup bounds and the current database position. The source must have an
        initial backup. Network selection follows the create operation's exclusions.
      x-docs-url: https://docs.crunchybridge.com/api/cluster#fork-cluster
      x-idempotent: false
      x-cost-bearing: true
      x-long-running: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClusterForkRequest'
      responses:
        '201':
          $ref: '#/components/responses/ClusterCreated'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'
  /clusters/{cluster_id}/actions/detach:
    parameters:
      - $ref: '#/components/parameters/XRequestId'
      - $ref: '#/components/parameters/ClusterId'
    put:
      operationId: detachClusterReplica
      tags:
        - Cluster replicas
      summary: Detach a cluster replica
      description: Detaches asynchronously into an independent writable cluster. Repeated calls no-op while detachment is pending; calling it after the cluster is no longer a replica returns an error.
      x-docs-url: https://docs.crunchybridge.com/api/cluster-replica#detach-replica
      x-idempotent: true
      x-disruptive: true
      x-long-running: true
      responses:
        '200':
          description: The detaching cluster.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cluster'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'
  /clusters/{cluster_id}/actions/disable-ha:
    parameters:
      - $ref: '#/components/parameters/XRequestId'
      - $ref: '#/components/parameters/ClusterId'
    put:
      operationId: disableClusterHighAvailability
      tags:
        - Clusters
      summary: Disable high availability
      description: Starts removal of the cluster's high-availability standby.
      x-docs-url: https://docs.crunchybridge.com/api/cluster#disable-high-availability
      x-idempotent: true
      x-disruptive: true
      x-long-running: true
      responses:
        '200':
          $ref: '#/components/responses/ClusterOperation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'
