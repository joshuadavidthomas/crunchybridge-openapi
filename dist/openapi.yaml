  parameters:
    XRequestId:
      name: X-Request-Id
      in: header
      required: false
      description: |
        A client-generated UUID used to correlate the request with logs, events,
        and support requests. The API generates one when this header is omitted.
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        A client-generated UUID that makes a POST or PATCH request safe to retry
        for one hour. A retry with the same method, path, and body replays the stored
        response. Reusing a key with another request or while the first request is
        still running returns 409. The API stores unsuccessful responses except
        transient 429, 500, and 503 responses.
      schema:
        type: string
        format: uuid
    AccessTokenId:
      name: access_token_id
      in: path
      required: true
      description: The access token's EID.
      schema:
        $ref: '#/components/schemas/EID'
    Cursor:
      name: cursor
      in: query
      required: false
      description: The `next_cursor` value returned by the preceding page.
      schema:
        type: string
    Limit200:
      name: limit
      in: query
      required: false
      description: Maximum number of resources to return.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 100
    Order:
      name: order
      in: query
      required: false
      description: Direction in which to order the resources.
      schema:
        type: string
        enum:
          - asc
          - desc
        default: asc
    ChangelogIdOrName:
      name: changelog_id_or_name
      in: path
      required: true
      description: The changelog entry's EID or unique name.
      schema:
        type: string
    ClusterId:
      name: cluster_id
      in: path
      required: true
      description: The cluster's EID.
      schema:
        $ref: '#/components/schemas/EID'
    ConfigurationParameterName:
      name: configuration_parameter_name
      in: path
      required: true
      description: Fully qualified configuration parameter name, including its component prefix and colon.
      schema:
        type: string
    LoggerId:
      name: logger_id
      in: path
      required: true
      description: The cluster logger's EID.
      schema:
        $ref: '#/components/schemas/EID'
    RoleName:
      name: role_name
      in: path
      required: true
      description: Postgres role name. Built-ins include `application`, `postgres`, `user`, and deprecated `default`; account roles use `u_<account_id>`.
      schema:
        type: string
    RuleId:
      name: rule_id
      in: path
      required: true
      description: The firewall rule's EID.
      schema:
        $ref: '#/components/schemas/EID'
    ConnectionId:
      name: connection_id
      in: path
      required: true
      description: The private-link connection's EID.
      schema:
        $ref: '#/components/schemas/EID'
    EventId:
      name: event_id
      in: path
      required: true
      description: The event's EID.
      schema:
        $ref: '#/components/schemas/EID'
    NetworkId:
      name: network_id
      in: path
      required: true
      description: The network's EID.
      schema:
        $ref: '#/components/schemas/EID'
    PeeringId:
      name: peering_id
      in: path
      required: true
      description: The network peering's EID.
      schema:
        $ref: '#/components/schemas/EID'
    PostgresVersionId:
      name: postgres_version_id
      in: path
      required: true
      description: The Postgres version's EID or major version number, such as `17`.
      schema:
        type: string
    TeamId:
      name: team_id
      in: path
      required: true
      description: The team's EID.
      schema:
        $ref: '#/components/schemas/EID'
    AccountId:
      name: account_id
      in: path
      required: true
      description: The account's EID.
      schema:
        $ref: '#/components/schemas/EID'
  headers:
    XRequestId:
      description: A UUID that identifies the request for tracing and support.
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      description: The idempotency key supplied with the request.
      required: false
      schema:
        type: string
        format: uuid
    IdempotencyReplay:
      description: True when the API replayed a stored response for this key.
      required: false
      schema:
        type: boolean
        const: true
    RetryAfter:
      description: Seconds to wait before retrying a rate-limited request.
      required: true
      schema:
        type: integer
        minimum: 0
  responses:
    Error:
      description: The request failed.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: The request is invalid.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: The request has no valid authentication credentials.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    IdempotencyConflict:
      description: The idempotency key is in flight or was used for another request.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Idempotency-Key:
          $ref: '#/components/headers/IdempotencyKey'
        Idempotency-Replay:
          $ref: '#/components/headers/IdempotencyReplay'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: The caller exceeded an API rate limit.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: The credential cannot perform this operation.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: The requested resource does not exist.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Gone:
      description: The resource existed but has already been deleted.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ClusterList:
      description: Clusters visible to the caller.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
